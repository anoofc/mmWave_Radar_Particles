[platformio]
default_envs = xiao_esp32c6

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
lib_deps = https://github.com/Seeed-Projects/Seeed-mmWave-library.git#ade050c62f874c214fe83ebb586d723c46b03226
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0

[env:minimal]
build_src_filter = +<minimal.cpp>

[env:xiao_esp32c6]
build_src_filter = +<main.cpp>
lib_deps =
  ${env.lib_deps}
  bblanchon/ArduinoJson@6.21.5
